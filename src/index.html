<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terakzor Console</title>
  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.32/dist/uPlot.min.css">
  <style>
    :root { color-scheme: dark; --ground: #111514; --panel: #181e1c; --line: #36403c; --text: #e7eee9; --muted: #8e9b94; --signal: #79e39d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--text); font-family: "IBM Plex Mono", "Courier New", monospace; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 4.5rem); letter-spacing: -0.08em; line-height: .85; text-transform: uppercase; }
    .status { color: var(--signal); font-size: .75rem; letter-spacing: .12em; white-space: nowrap; }
    .status::before { content: "●"; margin-right: 8px; }
    .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 24px 0; background: var(--line); border: 1px solid var(--line); }
    .readout { background: var(--panel); padding: 18px; }
    .label { color: var(--muted); display: block; font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; }
    output { display: block; margin-top: 8px; color: var(--signal); font-size: clamp(1.4rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: -.08em; }
    .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .chart-panel { min-width: 0; margin: 0; border: 1px solid var(--line); background: var(--panel); padding: 18px; }
    figcaption { color: var(--muted); font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; }
    .chart { width: 100%; min-height: 240px; margin-top: 14px; }
    .error { color: #ff8f88 !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 560px) { main { width: min(100% - 24px, 1120px); padding-top: 24px; } header { align-items: start; flex-direction: column; } .readouts, .chart-grid { grid-template-columns: 1fr; } .chart-panel { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Host<br>Monitor</h1><span id="status" class="status" role="status" aria-live="polite">Loading telemetry</span></header>
    <section id="readouts" class="readouts" aria-label="Current measurements"></section>
    <p id="chart-summary" class="sr-only" aria-live="polite">Loading telemetry.</p>
    <section id="charts" class="chart-grid" aria-label="Metric history" hidden></section>
  </main>
  <script src="https://unpkg.com/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
  <script>
    const status = document.querySelector("#status");
    const summary = document.querySelector("#chart-summary");
    const chartsElement = document.querySelector("#charts");
    const readoutsElement = document.querySelector("#readouts");
    let plots = [];
    let resizeObserver;

    const metricDefinitions = {
      cpu_percent: { label: "CPU load", chartLabel: "CPU percent", format: (value) => `${value.toFixed(1)}%`, stroke: "#79e39d" },
      ram_used_bytes: { label: "RAM used", chartLabel: "RAM bytes", format: bytes, stroke: "#9cbbb0" },
      disk_used_bytes: { label: "Disk used", chartLabel: "Disk bytes", format: bytes, stroke: "#74bad3" },
      uptime_seconds: { label: "Uptime", chartLabel: "Uptime seconds", format: (value) => `${Math.floor(value / 3600)}h ${Math.floor(value % 3600 / 60)}m`, stroke: "#e4ba74" },
      load_average_1m: { label: "Load average", chartLabel: "Load average (1m)", format: (value) => value.toFixed(2), stroke: "#d69aca" },
    };

    function bytes(value) {
      return value >= 1073741824 ? `${(value / 1073741824).toFixed(2)} GiB` : `${(value / 1048576).toFixed(1)} MiB`;
    }

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle("error", isError);
    }

    function definitionFor(metricName) {
      return metricDefinitions[metricName] || { label: metricName.replaceAll("_", " "), chartLabel: metricName.replaceAll("_", " "), format: (value) => value.toFixed(2), stroke: "#79e39d" };
    }

    function renderReadouts(latest) {
      readoutsElement.replaceChildren();
      Object.entries(latest).filter(([name, value]) => name !== "timestamp" && value != null).forEach(([name, value]) => {
        const definition = definitionFor(name);
        const readout = document.createElement("div");
        readout.className = "readout";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = definition.label;
        const output = document.createElement("output");
        output.textContent = definition.format(value);
        readout.append(label, output);
        readoutsElement.append(readout);
      });
    }

    function renderChart(metricName, samples, timestamps) {
      const definition = definitionFor(metricName);
      const panel = document.createElement("figure");
      panel.className = "chart-panel";
      const caption = document.createElement("figcaption");
      caption.textContent = definition.chartLabel;
      const target = document.createElement("div");
      target.id = `${metricName}-chart`;
      target.className = "chart";
      panel.append(caption, target);
      chartsElement.append(panel);
      createChart(target, definition.chartLabel, { timestamps, measurements: samples.map((sample) => sample[metricName] ?? null) }, definition.stroke, definition.format);
    }

    function createChart(target, label, values, stroke, format) {
      const plot = new uPlot({
        width: target.clientWidth,
        height: 240,
        legend: { show: false },
        series: [{}, { label, stroke, width: 2 }],
        axes: [{ stroke: "#8e9b94", grid: { stroke: "#28302d" } }, { stroke: "#8e9b94", grid: { stroke: "#28302d" }, values: (_, ticks) => ticks.map(format) }],
      }, [values.timestamps, values.measurements], target);
      plots.push({ plot, target });
    }

    fetch("/api/metrics")
      .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then(({ samples }) => {
        if (!samples.length) {
          setStatus("No telemetry collected");
          summary.textContent = "No telemetry has been collected yet.";
          return;
        }
        const latest = samples.at(-1);
        renderReadouts(latest);
        const metricNames = [...new Set(samples.flatMap((sample) => Object.keys(sample)))].filter((name) => name !== "timestamp");
        setStatus("Live data link");
        summary.textContent = `${metricNames.filter((name) => latest[name] != null).map((name) => `${definitionFor(name).label} is ${definitionFor(name).format(latest[name])}`).join("; ") || "metrics pending"}; ${samples.length} samples are displayed.`;
        chartsElement.hidden = false;
        chartsElement.replaceChildren();
        const timestamps = samples.map((sample) => sample.timestamp);
        metricNames.forEach((metricName) => renderChart(metricName, samples, timestamps));
        resizeObserver = new ResizeObserver(() => plots.forEach(({ plot, target }) => plot.setSize({ width: target.clientWidth, height: 240 })));
        resizeObserver.observe(chartsElement);
      })
      .catch((error) => {
        setStatus(`Telemetry error: ${error.message}`, true);
        summary.textContent = `Telemetry error: ${error.message}`;
      });

    window.addEventListener("pagehide", () => resizeObserver?.disconnect(), { once: true });
  </script>
</body>
</html>
